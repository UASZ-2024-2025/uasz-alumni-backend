openapi: 3.0.3
info:
  title: Service Gestion des Notifications et Messageries - Plateforme Alumni UASZ
  description: |
    Microservice responsable de la messagerie privée 1-à-1 entre utilisateurs, des groupes de discussion,
    ainsi que de la gestion et de la distribution des notifications (In-App, Email, Push).
  contact:
    name: Équipe Projet Intégrateur - M2 GL - UASZ
  version: 1.1.0
servers:
  - url: https://api.alumni-uasz.sn/notification-messaging-service/v1
    description: Serveur de production
  - url: http://localhost:8085/v1
    description: Serveur de développement local
tags:
  - name: PrivateMessaging
    description: Échanges et discussions privées 1-à-1 entre étudiants, Alumni et enseignants
  - name: GroupMessaging
    description: |
      Groupes de discussion (création, membres, réglages, échanges collectifs entre étudiants, Alumni et enseignants).
      Réservés aux rôles ETUDIANT, ALUMNI, ENSEIGNANT et ADMINISTRATEUR (403 pour ENTREPRISE).
  - name: Notifications
    description: Centre de notifications système, alertes et suivi de lecture

paths:
  /messages/conversations:
    get:
      tags:
        - PrivateMessaging
      summary: Lister les conversations privées de l'utilisateur connecté
      operationId: listConversations
      responses:
        "200":
          description: Liste des conversations avec le dernier message et le nombre de non-lus
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
        - bearerAuth: []

  /messages/conversations/{recipientId}:
    get:
      tags:
        - PrivateMessaging
      summary: Historique des messages d'une conversation avec un utilisateur
      operationId: getConversationMessages
      parameters:
        - name: recipientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Historique des messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateMessagePagedResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []

    post:
      tags:
        - PrivateMessaging
      summary: Envoyer un message privé à un utilisateur
      operationId: sendPrivateMessage
      parameters:
        - name: recipientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: Message envoyé avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
        - bearerAuth: []

  /messages/conversations/{recipientId}/read:
    patch:
      tags:
        - PrivateMessaging
      summary: Marquer tous les messages d'une conversation comme lus
      operationId: markConversationAsRead
      parameters:
        - name: recipientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Conversation marquée comme lue
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
        - bearerAuth: []

  /messages/{messageId}:
    delete:
      tags:
        - PrivateMessaging
      summary: Supprimer un message privé
      operationId: deletePrivateMessage
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Message supprimé
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []


  /messages/groups:
    get:
      tags:
        - GroupMessaging
      summary: Lister les groupes de discussion de l'utilisateur connecté
      description: |
        Groupes dont l'utilisateur est membre, archivés compris (voir `preferences.archived`),
        triés : épinglés d'abord, puis du plus récent au plus ancien (dernier message ou création).
      operationId: listGroups
      responses:
        "200":
          description: Liste des groupes avec le dernier message, le nombre de non-lus et les préférences de l'utilisateur
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
        - bearerAuth: []

    post:
      tags:
        - GroupMessaging
      summary: Créer un groupe de discussion
      description: |
        L'utilisateur connecté devient propriétaire (OWNER) du groupe ; les `memberIds` y entrent comme MEMBER
        (doublons et créateur ignorés). Réglages par défaut : voir `GroupSettings`.
        Un message système « X a créé le groupe » ouvre le fil.
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupCreateRequest"
      responses:
        "201":
          description: Groupe créé avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
        - bearerAuth: []

  /messages/groups/{groupId}:
    get:
      tags:
        - GroupMessaging
      summary: Obtenir le détail d'un groupe et la liste de ses membres (membres uniquement)
      operationId: getGroupById
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Détail du groupe, réglages et préférences de l'utilisateur connecté
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []

    put:
      tags:
        - GroupMessaging
      summary: Modifier le nom ou la description d'un groupe
      description: |
        Réservé aux administrateurs du groupe (OWNER ou ADMIN) tant que `settings.onlyAdminsCanEditInfo` vaut true ;
        sinon ouvert à tous les membres. Ajoute un message système.
      operationId: updateGroup
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdateRequest"
      responses:
        "200":
          description: Groupe mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []

    delete:
      tags:
        - GroupMessaging
      summary: Supprimer un groupe (propriétaire ou ADMINISTRATEUR de la plateforme)
      description: Supprime le groupe, ses membres, ses messages et les préférences associées.
      operationId: deleteGroup
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Groupe supprimé
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []

  /messages/groups/{groupId}/settings:
    patch:
      tags:
        - GroupMessaging
      summary: Modifier les réglages d'un groupe (administrateurs du groupe uniquement)
      description: Seuls les champs fournis sont modifiés. Réservé à OWNER et ADMIN. Ajoute un message système.
      operationId: updateGroupSettings
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupSettings"
      responses:
        "200":
          description: Réglages mis à jour, groupe renvoyé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []

  /messages/groups/{groupId}/preferences:
    patch:
      tags:
        - GroupMessaging
      summary: Modifier ses préférences personnelles sur un groupe (épingler, archiver, mettre en sourdine)
      description: |
        Préférences propres à l'utilisateur connecté (membres uniquement), invisibles des autres membres.
        Seuls les champs fournis sont modifiés.
      operationId: updateGroupPreferences
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupPreferencesUpdateRequest"
      responses:
        "200":
          description: Préférences mises à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupPreferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []

  /messages/groups/{groupId}/members:
    post:
      tags:
        - GroupMessaging
      summary: Ajouter des membres à un groupe
      description: |
        Réservé aux administrateurs du groupe (OWNER ou ADMIN) tant que `settings.onlyAdminsCanAddMembers` vaut true ;
        sinon ouvert à tous les membres. On ne rejoint pas un groupe de soi-même : il faut y être ajouté.
        Les personnes déjà membres sont ignorées ; les nouveaux entrent comme MEMBER. Ajoute un message système.
      operationId: addGroupMembers
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupMembersRequest"
      responses:
        "200":
          description: Membres ajoutés, groupe mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []

  /messages/groups/{groupId}/members/{userId}:
    patch:
      tags:
        - GroupMessaging
      summary: Nommer ou retirer un administrateur du groupe (propriétaire uniquement)
      description: |
        Passe un membre de MEMBER à ADMIN ou l'inverse. Le rôle OWNER ne s'attribue pas ainsi
        et le propriétaire ne peut pas changer son propre rôle (400). Ajoute un message système.
      operationId: updateGroupMemberRole
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupMemberRoleUpdateRequest"
      responses:
        "200":
          description: Rôle modifié, groupe renvoyé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []

    delete:
      tags:
        - GroupMessaging
      summary: Retirer un membre du groupe ou quitter le groupe
      description: |
        - Un membre peut toujours se retirer lui-même (quitter le groupe).
        - Le propriétaire peut retirer n'importe quel membre ; un ADMIN peut retirer les ADMIN et MEMBER, jamais le propriétaire.
        - Si le propriétaire quitte, la propriété passe à l'ADMIN le plus ancien, à défaut au membre le plus ancien ;
          si plus personne ne reste, le groupe est supprimé.
        Ajoute un message système.
      operationId: removeGroupMember
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Membre retiré
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []

  /messages/groups/{groupId}/messages:
    get:
      tags:
        - GroupMessaging
      summary: Historique des messages d'un groupe (membres uniquement)
      description: |
        La page 0 contient les messages les plus récents ; chaque page est renvoyée dans l'ordre chronologique
        (du plus ancien au plus récent), les pages suivantes remontent dans le temps.
      operationId: getGroupMessages
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Historique des messages du groupe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMessagePagedResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []

    post:
      tags:
        - GroupMessaging
      summary: Envoyer un message dans un groupe
      description: |
        Membres uniquement ; si `settings.onlyAdminsCanSend` vaut true, seuls OWNER et ADMIN peuvent écrire (403 sinon).
        Le contenu ne peut pas être vide et fait au plus 4000 caractères (400).
      operationId: sendGroupMessage
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: Message envoyé au groupe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []

  /messages/groups/{groupId}/messages/{messageId}:
    delete:
      tags:
        - GroupMessaging
      summary: Supprimer un message pour tous
      description: |
        L'auteur peut supprimer son message ; OWNER et ADMIN peuvent supprimer celui de n'importe quel membre.
        Le message reste dans le fil avec `deleted` à true et un contenu vide. Les messages système ne se suppriment pas (400).
      operationId: deleteGroupMessage
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Message supprimé
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []

  /messages/groups/{groupId}/read:
    patch:
      tags:
        - GroupMessaging
      summary: Marquer tous les messages d'un groupe comme lus
      operationId: markGroupAsRead
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Groupe marqué comme lu
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []


  /notifications:
    get:
      tags:
        - Notifications
      summary: Obtenir la liste des notifications de l'utilisateur
      operationId: getUserNotifications
      parameters:
        - name: unreadOnly
          in: query
          description: Ne retourner que les notifications non lues
          required: false
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Liste des notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPagedResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
        - bearerAuth: []

  /notifications/unread-count:
    get:
      tags:
        - Notifications
      summary: Obtenir le nombre total de notifications non lues
      operationId: getUnreadNotificationCount
      responses:
        "200":
          description: Nombre de notifications non lues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
        - bearerAuth: []

  /notifications/{id}/read:
    patch:
      tags:
        - Notifications
      summary: Marquer une notification spécifique comme lue
      operationId: markNotificationAsRead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Notification marquée comme lue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []

  /notifications/read-all:
    patch:
      tags:
        - Notifications
      summary: Marquer toutes les notifications comme lues
      operationId: markAllNotificationsAsRead
      responses:
        "204":
          description: Toutes les notifications ont été marquées comme lues
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
        - bearerAuth: []

  /notifications/send:
    post:
      tags:
        - Notifications
      summary: Émettre/déclencher une notification (Usage interne inter-services ou Admin)
      operationId: triggerNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendNotificationRequest"
      responses:
        "201":
          description: Notification émise avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
        - bearerAuth: []

components:
  schemas:
    NotificationType:
      type: string
      enum:
        - MESSAGE_RECEIVED
        - APPLICATION_STATUS_CHANGED
        - NEW_JOB_PROPOSAL
        - NEW_MATCHING_OFFER
        - ACCOUNT_CONFIRMATION
        - SYSTEM_ALERT
        - GROUP_INVITATION
        - GROUP_MESSAGE_RECEIVED

    NotificationChannel:
      type: string
      enum:
        - IN_APP
        - EMAIL
        - PUSH

    ConversationSummary:
      type: object
      properties:
        recipientId:
          type: string
          format: uuid
        recipientName:
          type: string
        recipientRole:
          type: string
          example: "ALUMNI"
        lastMessage:
          type: string
        lastMessageTime:
          type: string
          format: date-time
        unreadCount:
          type: integer
          example: 3

    PrivateMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        senderName:
          type: string
        recipientId:
          type: string
          format: uuid
        recipientName:
          type: string
        content:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    SendMessageRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          example: "Bonjour ! Seriez-vous disponible pour discuter des opportunités dans votre entreprise ?"


    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/NotificationType"
        channel:
          $ref: "#/components/schemas/NotificationChannel"
        title:
          type: string
        content:
          type: string
        referenceId:
          type: string
          description: ID de l'élément concerné (ex. ID de l'offre ou ID du message)
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    SendNotificationRequest:
      type: object
      required:
        - userId
        - type
        - title
        - content
      properties:
        userId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/NotificationType"
        channel:
          $ref: "#/components/schemas/NotificationChannel"
        title:
          type: string
        content:
          type: string
        referenceId:
          type: string

    UnreadCountResponse:
      type: object
      properties:
        unreadCount:
          type: integer
          example: 5

    PrivateMessagePagedResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/PrivateMessage"
        totalElements:
          type: integer
        page:
          type: integer
        size:
          type: integer


    NotificationPagedResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        totalElements:
          type: integer
        page:
          type: integer
        size:
          type: integer

    GroupMemberRole:
      type: string
      description: |
        Rôle dans le groupe. OWNER (un seul, le propriétaire) et ADMIN sont les « administrateurs du groupe » ;
        à ne pas confondre avec le rôle applicatif ADMINISTRATEUR.
      enum:
        - OWNER
        - ADMIN
        - MEMBER

    GroupMember:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        userName:
          type: string
          description: Nom affiché ; absent tant que l'utilisateur ne s'est jamais connecté au service.
        userRole:
          type: string
          description: Rôle applicatif de l'utilisateur (ALUMNI, ETUDIANT, ENSEIGNANT, ADMINISTRATEUR)
          example: "ETUDIANT"
        groupRole:
          $ref: "#/components/schemas/GroupMemberRole"
        joinedAt:
          type: string
          format: date-time

    GroupSettings:
      type: object
      description: |
        Réglages du groupe, modifiables par OWNER et ADMIN. Valeurs par défaut à la création :
        onlyAdminsCanSend=false, onlyAdminsCanEditInfo=true, onlyAdminsCanAddMembers=true.
      properties:
        onlyAdminsCanSend:
          type: boolean
          description: Seuls OWNER et ADMIN peuvent envoyer des messages.
        onlyAdminsCanEditInfo:
          type: boolean
          description: Seuls OWNER et ADMIN peuvent modifier le nom et la description.
        onlyAdminsCanAddMembers:
          type: boolean
          description: Seuls OWNER et ADMIN peuvent ajouter des membres.

    MuteDuration:
      type: string
      description: Durée de mise en sourdine ; NONE la lève.
      enum:
        - NONE
        - EIGHT_HOURS
        - ONE_WEEK
        - ALWAYS

    GroupPreferences:
      type: object
      description: Préférences de l'utilisateur connecté sur un groupe (personnelles, invisibles des autres membres).
      properties:
        pinned:
          type: boolean
        archived:
          type: boolean
        muted:
          type: boolean
          description: Vrai si la sourdine est active à l'instant de la réponse.
        mutedUntil:
          type: string
          format: date-time
          description: Fin de la sourdine ; absent si elle est permanente (ALWAYS) ou inactive.

    GroupPreferencesUpdateRequest:
      type: object
      properties:
        pinned:
          type: boolean
        archived:
          type: boolean
        mute:
          $ref: "#/components/schemas/MuteDuration"

    GroupMemberRoleUpdateRequest:
      type: object
      required:
        - groupRole
      properties:
        groupRole:
          type: string
          enum:
            - ADMIN
            - MEMBER

    Group:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Promotion 2026 - Génie Logiciel"
        description:
          type: string
        ownerId:
          type: string
          format: uuid
        members:
          type: array
          items:
            $ref: "#/components/schemas/GroupMember"
        settings:
          $ref: "#/components/schemas/GroupSettings"
        preferences:
          $ref: "#/components/schemas/GroupPreferences"
        createdAt:
          type: string
          format: date-time

    GroupSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        memberCount:
          type: integer
          example: 12
        lastMessage:
          type: string
          description: Contenu du dernier message (vide s'il a été supprimé).
        lastMessageSenderName:
          type: string
        lastMessageType:
          $ref: "#/components/schemas/GroupMessageType"
        lastMessageTime:
          type: string
          format: date-time
        unreadCount:
          type: integer
          example: 3
        preferences:
          $ref: "#/components/schemas/GroupPreferences"

    GroupCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          example: "Mentorat Alumni - Data & IA"
        description:
          type: string
        memberIds:
          type: array
          description: Identifiants des utilisateurs invités dès la création
          items:
            type: string
            format: uuid

    GroupUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string

    GroupMembersRequest:
      type: object
      required:
        - memberIds
      properties:
        memberIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    GroupMessageType:
      type: string
      description: TEXT pour un message d'un membre, SYSTEM pour un événement du groupe (création, ajout, départ...).
      enum:
        - TEXT
        - SYSTEM

    GroupMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        senderName:
          type: string
        type:
          $ref: "#/components/schemas/GroupMessageType"
        content:
          type: string
          description: Texte du message ; vide si le message a été supprimé.
        deleted:
          type: boolean
        createdAt:
          type: string
          format: date-time

    GroupMessagePagedResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/GroupMessage"
        totalElements:
          type: integer
        page:
          type: integer
        size:
          type: integer

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time

  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentification requise
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Accès refusé
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Ressource non trouvée
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
