openapi: 3.0.3
info:
  title: User Service API - Plateforme Alumni UASZ
  description: |
    Microservice de gestion des utilisateurs et de l'authentification pour la plateforme de gestion des Alumni du Master Informatique (UASZ).
  contact:
    name: Équipe Projet Intégrateur - M2 GL - UASZ
  version: 1.5.1
servers:
  - url: https://api.alumni-uasz.sn/user-service/v1
    description: Serveur de production
  - url: http://localhost:8081/v1
    description: Serveur de développement local
tags:
  - name: Auth
    description: "Authentification, sécurité du compte et gestion des sessions"
  - name: Users
    description: Gestion des utilisateurs
  - name: Roles
    description: Gestion des rôles
  - name: Internal
    description: |
      Opérations réservées aux autres microservices (jeton de service, rôle SERVICE, voir ADR-0010).
      Elles ne sont pas exposées au frontend.
paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Inscription d'un nouvel utilisateur
      operationId: registerUser
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: "Compte créé avec succès (statut en_attente, email de confirmation envoyé)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email déjà utilisé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/login:
    post:
      tags:
        - Auth
      summary: Connexion d'un utilisateur
      operationId: loginUser
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Compte non activé ou suspendu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "423":
          description: Compte temporairement verrouillé après trop d'échecs de connexion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/refresh-token:
    post:
      tags:
        - Auth
      summary: Rafraîchir le token d'accès
      operationId: refreshToken
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          description: Nouveau token généré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Refresh token invalide ou expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Déconnexion (invalidation du refresh token)
      operationId: logoutUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
        required: true
      responses:
        "204":
          description: Déconnexion réussie
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
      security:
        - bearerAuth: []
  /auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Demande de réinitialisation du mot de passe
      operationId: forgotPassword
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
        required: true
      responses:
        "200":
          description: |
            Requête traitée. Un email est envoyé si le compte existe (réponse volontairement générique pour éviter l'énumération de comptes).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/reset-password:
    post:
      tags:
        - Auth
      summary: Réinitialisation du mot de passe via token
      operationId: resetPassword
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "200":
          description: Mot de passe réinitialisé avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Token invalide ou expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "422":
          description: Mot de passe non conforme à la politique de sécurité
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/confirm-email:
    post:
      tags:
        - Auth
      summary: Confirmation de l'adresse email (activation du compte)
      operationId: confirmEmail
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmEmailRequest"
        required: true
      responses:
        "200":
          description: Compte activé avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Token invalide ou expiré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/resend-confirmation:
    post:
      tags:
        - Auth
      summary: Renvoyer l'email de confirmation de compte
      operationId: resendConfirmation
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendConfirmationRequest"
        required: true
      responses:
        "200":
          description: Email de confirmation renvoyé (si applicable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Le compte est déjà activé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/change-password:
    post:
      tags:
        - Auth
      summary: Changer son mot de passe (utilisateur connecté)
      description: |
        Révoque tous les refresh tokens de l'utilisateur : il doit se reconnecter.
        Politique : 8 à 72 octets, au moins une lettre et un chiffre.
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "200":
          description: Mot de passe modifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Mot de passe actuel incorrect ou nouveau mot de passe identique
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: Nouveau mot de passe non conforme à la politique de sécurité
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
  /users:
    get:
      tags:
        - Users
      summary: Lister les utilisateurs (filtrage par rôle)
      operationId: listUsers
      parameters:
        - name: role
          in: query
          description: Filtrer par rôle
          required: false
          schema:
            $ref: "#/components/schemas/RoleName"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/UserStatus"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Liste paginée des utilisateurs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPagedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
        - bearerAuth: []
    post:
      tags:
        - Users
      summary: Créer un compte utilisateur (ADMINISTRATEUR)
      description: |
        Le compte est créé au statut EN_ATTENTE sans mot de passe utilisable. Un email invite
        l'utilisateur à définir son mot de passe (lien traité par POST /auth/reset-password,
        qui active le compte).
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
        required: true
      responses:
        "201":
          description: Compte créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
      security:
        - bearerAuth: []
  /users/{id}:
    get:
      tags:
        - Users
      summary: Récupérer un utilisateur par son identifiant
      description: Réservé à l'utilisateur lui-même ou à un ADMINISTRATEUR.
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Utilisateur trouvé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []
    put:
      tags:
        - Users
      summary: Mettre à jour les informations d'un utilisateur
      description: Mise à jour partielle (les champs absents sont conservés). Seul un ADMINISTRATEUR peut modifier l'email (403 sinon, 409 si déjà utilisé).
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
        required: true
      responses:
        "200":
          description: Utilisateur mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
      security:
        - bearerAuth: []
    delete:
      tags:
        - Users
      summary: Supprimer un utilisateur
      operationId: deleteUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Utilisateur supprimé
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
        - bearerAuth: []
  /users/{id}/status:
    patch:
      tags:
        - Users
      summary: Modifier le statut d'un utilisateur (activation/désactivation/suspension)
      description: Passer à ACTIF lève aussi un éventuel verrouillage. Passer à INACTIF ou SUSPENDU révoque les sessions.
      operationId: updateUserStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStatusUpdateRequest"
        required: true
      responses:
        "200":
          description: Statut mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Action réservée à l'Administrateur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
      security:
        - bearerAuth: []
  /internal/users/{id}/company:
    put:
      tags:
        - Internal
      summary: Rattacher un compte ENTREPRISE à sa fiche entreprise (usage interne)
      description: |
        Appelé par alumni-student-company-service quand un compte ENTREPRISE crée sa fiche, ou quand un
        administrateur la rattache à un compte. Réservé aux jetons de service (rôle SERVICE, audience
        `user-service`) : un JWT utilisateur reçoit 403.

        **Idempotent** : rattacher un compte à la fiche à laquelle il est déjà rattaché renvoie 200 sans
        rien modifier. 409 si le compte n'est pas un compte ENTREPRISE ou s'il est déjà rattaché à une
        autre fiche.

        Le `companyId` apparaît ensuite dans `User.companyId` et dans les prochains jetons d'accès
        (claim `companyId`, après `POST /auth/refresh-token`).
      operationId: linkCompanyAccount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCompanyLinkRequest"
      responses:
        "200":
          description: Compte rattaché (ou déjà rattaché à cette fiche)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
      security:
        - bearerAuth: []
  /roles:
    get:
      tags:
        - Roles
      summary: Lister les rôles disponibles
      operationId: listRoles
      responses:
        "200":
          description: Liste des rôles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
        - bearerAuth: []
components:
  schemas:
    RoleName:
      type: string
      enum:
        - ALUMNI
        - ETUDIANT
        - ENSEIGNANT
        - ENTREPRISE
        - ADMINISTRATEUR
    Gender:
      type: string
      nullable: true
      enum:
        - MALE
        - FEMALE
        - null
    UserStatus:
      type: string
      enum:
        - EN_ATTENTE
        - ACTIF
        - INACTIF
        - SUSPENDU
    UserCreateRequest:
      required:
        - email
        - firstName
        - lastName
        - role
      type: object
      properties:
        lastName:
          type: string
          minLength: 1
        firstName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        phone:
          type: string
        role:
          $ref: "#/components/schemas/RoleName"
    ChangePasswordRequest:
      required:
        - currentPassword
        - newPassword
      type: object
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          minLength: 8
          type: string
          format: password
    RegisterRequest:
      required:
        - email
        - firstName
        - lastName
        - password
        - role
      type: object
      properties:
        lastName:
          type: string
          minLength: 1
        firstName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        password:
          minLength: 8
          type: string
          format: password
        role:
          $ref: "#/components/schemas/RoleName"
    LoginRequest:
      required:
        - email
        - password
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Durée de validité de l'accessToken en secondes
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lastName:
          type: string
        firstName:
          type: string
        email:
          type: string
          format: email
          minLength: 1
        role:
          $ref: "#/components/schemas/RoleName"
        status:
          $ref: "#/components/schemas/UserStatus"
        createdAt:
          type: string
          format: date-time
        phone:
          type: string
          nullable: true
        gender:
          $ref: "#/components/schemas/Gender"
        birthDate:
          type: string
          format: date
          nullable: true
          example: "1995-05-15"
        companyId:
          type: string
          format: uuid
          nullable: true
          description: |
            Fiche entreprise rattachée au compte (comptes ENTREPRISE uniquement). Null tant que le compte
            n'est pas rattaché. Également présent dans le jeton d'accès (claim `companyId`).
    UserUpdateRequest:
      type: object
      properties:
        lastName:
          type: string
          minLength: 1
        firstName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        phone:
          type: string
        gender:
          $ref: "#/components/schemas/Gender"
        birthDate:
          type: string
          format: date
          example: "1995-05-15"
    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/RoleName"
        permissions:
          type: array
          items:
            type: string
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
    RefreshTokenRequest:
      required:
        - refreshToken
      type: object
      properties:
        refreshToken:
          type: string
    LogoutRequest:
      required:
        - refreshToken
      type: object
      properties:
        refreshToken:
          type: string
    ForgotPasswordRequest:
      required:
        - email
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
    ResetPasswordRequest:
      required:
        - newPassword
        - token
      type: object
      properties:
        token:
          type: string
        newPassword:
          minLength: 8
          type: string
          format: password
    ConfirmEmailRequest:
      required:
        - token
      type: object
      properties:
        token:
          type: string
    ResendConfirmationRequest:
      required:
        - email
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
    UserPagedResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/User"
        totalElements:
          type: integer
        page:
          type: integer
        size:
          type: integer
    UserStatusUpdateRequest:
      required:
        - status
      type: object
      properties:
        status:
          $ref: "#/components/schemas/UserStatus"
    UserCompanyLinkRequest:
      required:
        - companyId
      type: object
      properties:
        companyId:
          type: string
          format: uuid
          description: Identifiant de la fiche entreprise (alumni-student-company-service)
  responses:
    BadRequest:
      description: Requête invalide ou corps illisible (MALFORMED_REQUEST)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentification requise ou invalide
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Accès refusé (permissions insuffisantes)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflit avec l'état actuel de la ressource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: Content-Type absent ou non supporté (UNSUPPORTED_MEDIA_TYPE)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Limiteur de débit atteint (TOO_MANY_REQUESTS)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT