server:
  port: ${SERVER_PORT}
  shutdown: graceful
  # "native" derrière un ingress de confiance pour obtenir la vraie IP cliente
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY}

spring:
  application:
    name: user-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD viennent de l'environnement
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  # SMTP : Mailpit en dev (aucun identifiant), serveur réel en prod. MAIL_USERNAME / MAIL_PASSWORD facultatifs.
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

management:
  health:
    # une panne SMTP ne doit pas rendre le service "non prêt"
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

security:
  api:
    prefix: ${API_PREFIX}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Secret et émetteur identiques dans TOUS les services.
# user-service génère le secret ; les autres le copient (make setup / make jwt-sync).
jwt:
  # Base64, 32 octets minimum
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER}
  # Durée de vie de l'access token (format Spring : 15m, 1h)
  access-ttl: ${JWT_ACCESS_TTL}

auth:
  refresh-ttl: ${REFRESH_TOKEN_TTL}
  password-reset-ttl: ${PASSWORD_RESET_TTL}
  max-failed-attempts: ${MAX_FAILED_ATTEMPTS}
  lock-duration: ${LOCK_DURATION}
  # Premier ADMINISTRATEUR créé au démarrage s'il n'en existe aucun d'actif (ignoré si email ou mot de passe vide)
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME}
    last-name: ${BOOTSTRAP_ADMIN_LAST_NAME}

app:
  # URL publique du frontend : base des liens envoyés par email (/confirmation-email?token=...)
  frontend-url: ${FRONTEND_URL}
  mail-from: ${MAIL_FROM}
  # Durée de validité du lien de confirmation (format Spring : 30m, 24h, 2d)
  confirmation-ttl: ${EMAIL_CONFIRMATION_TTL}
  # Limitation de débit par IP, par fenêtre de window-seconds.
  #  - max-requests : register, resend-confirmation, forgot-password, reset-password
  #  - login-max-requests : login, refresh-token (plus haut : plusieurs utilisateurs peuvent partager l'IP du campus)
  rate-limit:
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:10}
    login-max-requests: ${RATE_LIMIT_LOGIN_MAX_REQUESTS:30}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
