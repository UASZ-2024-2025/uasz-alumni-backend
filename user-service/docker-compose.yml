# Aucune valeur par défaut ni secret ici : tout vient de .env (voir .env.example, `make setup`).
# ${VAR:?msg} -> échoue si la variable est absente OU vide
#   make db -> PostgreSQL seul (l'appli tourne en local)
#   make up -> tout en conteneurs
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant, lancez make setup}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant, lancez make setup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant, lancez make setup}
    ports:
      - "127.0.0.1:${DB_PORT:?DB_PORT manquant}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Faux serveur SMTP de développement : les emails sont visibles sur http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:${MAIL_PORT:?MAIL_PORT manquant}:1025"

  user-service:
    build:
      context: ..
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: user-service
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SERVER_PORT: ${SERVER_PORT:?SERVER_PORT manquant}
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:?FORWARD_HEADERS_STRATEGY manquant}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB manquant}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER manquant}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant, lancez make setup}
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER manquant}
      API_PREFIX: ${API_PREFIX:?API_PREFIX manquant}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS manquant}
      # Dans Docker, l'appli joint Mailpit par le nom du service (port interne 1025)
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM manquant}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL manquant}
      EMAIL_CONFIRMATION_TTL: ${EMAIL_CONFIRMATION_TTL:?EMAIL_CONFIRMATION_TTL manquant}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:?JWT_ACCESS_TTL manquant}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:?REFRESH_TOKEN_TTL manquant}
      PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL:?PASSWORD_RESET_TTL manquant}
      MAX_FAILED_ATTEMPTS: ${MAX_FAILED_ATTEMPTS:?MAX_FAILED_ATTEMPTS manquant}
      LOCK_DURATION: ${LOCK_DURATION:?LOCK_DURATION manquant}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_FIRST_NAME: ${BOOTSTRAP_ADMIN_FIRST_NAME:?BOOTSTRAP_ADMIN_FIRST_NAME manquant}
      BOOTSTRAP_ADMIN_LAST_NAME: ${BOOTSTRAP_ADMIN_LAST_NAME:?BOOTSTRAP_ADMIN_LAST_NAME manquant}
    ports:
      - "127.0.0.1:${SERVER_PORT:?SERVER_PORT manquant}:${SERVER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${SERVER_PORT}/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

volumes:
  pgdata:
