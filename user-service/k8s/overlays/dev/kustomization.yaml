apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: alumni-uasz
resources:
  - ../../base
  - postgres.yaml
images:
  - name: user-service
    newName: user-service
    newTag: dev
configMapGenerator:
  - name: user-service-config
    behavior: merge
    literals:
      - CORS_ALLOWED_ORIGINS=http://localhost:4200
# Secrets générés par `make k8s-secrets` à partir de .env (fichiers ignorés par git) :
#   db.env  : POSTGRES_USER, POSTGRES_PASSWORD
#   app.env : JWT_SECRET, BOOTSTRAP_ADMIN_PASSWORD
secretGenerator:
  - name: user-service-db
    envs:
      - db.env
  - name: user-service-secrets
    envs:
      - app.env
patches:
  - target:
      kind: Deployment
      name: user-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
