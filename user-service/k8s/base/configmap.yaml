apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
data:
  SERVER_PORT: "8081"
  SPRING_DATASOURCE_URL: jdbc:postgresql://user-service-postgres:5432/user_db
  FORWARD_HEADERS_STRATEGY: native
  # URL de production des contrats : https://api.alumni-uasz.sn/user-service/v1
  API_PREFIX: /user-service/v1
  JWT_ISSUER: alumni-uasz-user
  # Emails : serveur SMTP réel à fournir par overlay (prod). MAIL_USERNAME / MAIL_PASSWORD : secret hors dépôt.
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  MAIL_FROM: no-reply@alumni-uasz.sn
  FRONTEND_URL: http://localhost:4200
  EMAIL_CONFIRMATION_TTL: 24h
