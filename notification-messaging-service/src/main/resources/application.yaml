server:
  port: ${SERVER_PORT}
  shutdown: graceful
  # "native" derrière un ingress de confiance pour obtenir la vraie IP cliente
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY}

spring:
  application:
    name: notification-messaging-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD viennent de l'environnement
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  # Canal EMAIL des notifications (ALUM-135). MAIL_HOST vide : les e-mails sont sautés (journalisés),
  # les notifications restent visibles dans l'application.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

management:
  health:
    # une panne SMTP ne doit pas rendre le service "non prêt"
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

security:
  api:
    prefix: ${API_PREFIX}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Secret et émetteur identiques dans TOUS les services.
# user-service génère le secret ; les autres le copient (make setup / make jwt-sync).
jwt:
  # Base64, 32 octets minimum
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER}

# Jetons de service acceptés sur POST /notifications/send (ADR-0010) : émetteur interne, audience = ce service
service-token:
  issuer: alumni-uasz-internal

notification:
  mail:
    from: ${MAIL_FROM:no-reply@alumni-uasz.sn}
  # Lien « Retrouvez vos notifications » dans les e-mails (vide : pas de lien)
  frontend-url: ${FRONTEND_URL:}
