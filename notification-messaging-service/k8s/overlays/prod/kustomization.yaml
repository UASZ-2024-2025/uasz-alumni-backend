apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: alumni-uasz
resources:
  - ../../base
images:
  - name: notification-messaging-service
    newName: ghcr.io/uasz-2024-2025/uasz-alumni-backend/notification-messaging-service   # À ADAPTER (le workflow deploy.yml fixe le tag)
    newTag: latest
configMapGenerator:
  - name: notification-messaging-service-config
    behavior: merge
    literals:                            # À ADAPTER
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-prod.example:5432/notification_messaging_db
      - CORS_ALLOWED_ORIGINS=https://alumni-uasz.sn
# Secrets à créer hors dépôt dans le namespace :
#   notification-messaging-service-db      : POSTGRES_USER, POSTGRES_PASSWORD
#   notification-messaging-service-secrets : JWT_SECRET (IDENTIQUE dans tous les services)
