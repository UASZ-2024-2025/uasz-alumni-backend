# Paramètres d'analyse COMMUNS aux 5 microservices (format clé=valeur, une par ligne).
# Lus par sonar/sonar.sh et passés au plugin Maven en -D<clé>=<valeur>.
# projectKey / projectName sont calculés par le script (alumni-uasz_<service>).
# Modifier ce fichier = modifier la configuration pour toute l'équipe (via git).

sonar.sourceEncoding=UTF-8

# Fichiers exclus de toute analyse
sonar.exclusions=**/target/**,**/k8s/**,**/scripts/**,**/db/migration/**

# Fichiers exclus du calcul de couverture (pas de logique testable)
sonar.coverage.exclusions=**/*Application.java,**/package-info.java,**/config/**

# Rapport de couverture JaCoCo (généré par sonar.sh, chemin relatif au service)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
