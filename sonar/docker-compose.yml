# SonarQube Community local pour le projet Alumni UASZ.
# Utilisation : ./sonar/sonar.sh up   (ne pas lancer ce fichier à la main)
# Variables optionnelles : SONAR_IMAGE (défaut sonarqube:community), SONAR_PORT (défaut 9000)
name: alumni-sonar

services:
  sonar-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 3s
      retries: 10

  sonarqube:
    image: ${SONAR_IMAGE:-sonarqube:community}
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # Évite d'exiger vm.max_map_count=262144 sur la machine hôte (usage dev uniquement)
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "127.0.0.1:${SONAR_PORT:-9000}:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192

volumes:
  sonar_db:
  sonar_data:
  sonar_extensions:
  sonar_logs:
