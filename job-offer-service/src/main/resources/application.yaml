server:
  port: ${SERVER_PORT}
  shutdown: graceful
  # "native" derrière un ingress de confiance pour obtenir la vraie IP cliente
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY}

spring:
  application:
    name: job-offer-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD viennent de l'environnement
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

security:
  api:
    prefix: ${API_PREFIX}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Secret et émetteur identiques dans TOUS les services.
# user-service génère le secret ; les autres le copient (make setup / make jwt-sync).
jwt:
  # Base64, 32 octets minimum
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER}

# Jetons de service pour les appels inter-services (ADR-0010) : émetteur interne, distinct de user-service
service-token:
  issuer: alumni-uasz-internal
  ttl: 5m

# Client de notification-messaging-service (ADR-0006 : REST, timeouts, retry, non bloquant)
notification:
  base-url: ${NOTIFICATION_SERVICE_URL}
  connect-timeout: 2s
  read-timeout: 3s
  retry:
    # 1 essai + 3 retries, délais 500 ms -> 1 s -> 2 s (plafond 5 s)
    max-retries: 3
    delay-ms: 500
    multiplier: 2
    max-delay-ms: 5000
