server:
  port: ${SERVER_PORT}
  shutdown: graceful
  # "native" derrière un ingress de confiance pour obtenir la vraie IP cliente
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY}

spring:
  application:
    name: job-offer-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD viennent de l'environnement
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

security:
  api:
    prefix: ${API_PREFIX}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Secret et émetteur identiques dans TOUS les services.
# user-service génère le secret ; les autres le copient (make setup / make jwt-sync).
jwt:
  # Base64, 32 octets minimum
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER}

# Jetons de service pour les appels inter-services (ADR-0010) : émetteur interne, distinct de jwt.issuer
service-token:
  issuer: alumni-uasz-internal
  ttl: 5m

# Client de notification-messaging-service (ALUM-83, ADR-0006 : jeton de service, timeouts, retry, non bloquant)
notification:
  base-url: ${NOTIFICATION_SERVICE_URL}
  connect-timeout: 2s
  read-timeout: 3s
  retry:
    # 1 essai + 3 retries, délais 500 ms -> 1 s -> 2 s (plafond 5 s)
    max-retries: 3
    delay-ms: 500
    multiplier: 2
    max-delay-ms: 5000

# Lecture synchrone des non-lus pour la synthèse d'accueil étudiant (ALUM-243).
# ADR-0006 : la requête de l'étudiant attend la réponse, donc un seul retry et des délais courts.
unread:
  retry:
    max-retries: 1
    delay-ms: 200
    multiplier: 2
    max-delay-ms: 1000

# Client d'alumni-student-company-service : lecture de la fiche entreprise avant publication (ALUM-148).
# ADR-0006 : lecture synchrone, timeouts courts, un seul retry (la requête de l'utilisateur attend la réponse).
company:
  base-url: ${STUDENT_COMPANY_SERVICE_URL}
  connect-timeout: 2s
  read-timeout: 3s
  retry:
    max-retries: 1
    delay-ms: 200
    multiplier: 2
    max-delay-ms: 1000

# Fermeture automatique des offres dont la date limite est dépassée (UTC, offre ouverte jusqu'à la fin du jour limite)
offers:
  expiration:
    cron: "0 5 0 * * *"
