apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: alumni-uasz
resources:
  - ../../base
images:
  - name: job-offer-service
    newName: ghcr.io/uasz-2024-2025/uasz-alumni-backend/job-offer-service   # À ADAPTER (le workflow deploy.yml fixe le tag)
    newTag: latest
configMapGenerator:
  - name: job-offer-service-config
    behavior: merge
    literals:                            # À ADAPTER
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-prod.example:5432/job_offer_db
      - CORS_ALLOWED_ORIGINS=https://alumni-uasz.sn
# Secrets à créer hors dépôt dans le namespace :
#   job-offer-service-db      : POSTGRES_USER, POSTGRES_PASSWORD
#   job-offer-service-secrets : JWT_SECRET (IDENTIQUE dans tous les services)
