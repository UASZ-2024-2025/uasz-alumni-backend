server:
  port: ${SERVER_PORT}
  shutdown: graceful
  # "native" derrière un ingress de confiance pour obtenir la vraie IP cliente
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY}

spring:
  application:
    name: alumni-student-company-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD viennent de l'environnement
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  # Photo du CV (ALUM-255) : le service refuse au-delà de 2 Mo avec un message clair (400 PHOTO_TOO_LARGE) ;
  # la limite technique est plus haute pour que ce message soit renvoyé au lieu d'une erreur 413 générique.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

security:
  api:
    prefix: ${API_PREFIX}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Secret et émetteur identiques dans TOUS les services.
# user-service génère le secret ; les autres le copient (make setup / make jwt-sync).
jwt:
  # Base64, 32 octets minimum
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER}

# Jetons de service acceptés sur /internal/** (ADR-0010) : émetteur interne, audience = ce service
service-token:
  issuer: alumni-uasz-internal
  ttl: 5m

# Client de user-service : rattachement du compte ENTREPRISE à sa fiche (ALUM-168).
# ADR-0006 : REST, timeouts, retry, appel non bloquant à la création de la fiche.
user-service:
  base-url: ${USER_SERVICE_URL}
  connect-timeout: 2s
  read-timeout: 3s
  retry:
    # 1 essai + 3 retries, délais 500 ms -> 1 s -> 2 s (plafond 5 s)
    max-retries: 3
    delay-ms: 500
    multiplier: 2
    max-delay-ms: 5000

# Client de notification-messaging-service (ALUM-119, ADR-0006 : jeton de service, timeouts, retry, non bloquant)
notification:
  base-url: ${NOTIFICATION_SERVICE_URL}
  connect-timeout: 2s
  read-timeout: 3s
  retry:
    max-retries: 3
    delay-ms: 500
    multiplier: 2
    max-delay-ms: 5000

# Client de notification-messaging-service : messages non lus de la synthèse d'accueil Alumni (ALUM-246).
# ADR-0006 : REST, JWT de l'utilisateur propagé, timeouts courts et un seul retry (lecture sur une page d'accueil) ;
# service injoignable = compteur à 0, jamais d'erreur pour l'appelant.
notification-messaging-service:
  base-url: ${NOTIFICATION_SERVICE_URL}
  connect-timeout: 1s
  read-timeout: 2s
  retry:
    # 1 essai + 1 retry après 200 ms
    max-retries: 1
    delay-ms: 200
    multiplier: 2
    max-delay-ms: 1000
