# Profil de test : tout est en dur (le application.yaml principal n'a aucune valeur par défaut).
server:
  port: 0
  forward-headers-strategy: none
spring:
  datasource:
    url: jdbc:h2:mem:students;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
security:
  api:
    prefix: /v1
  cors:
    allowed-origins: http://localhost:4200
jwt:
  secret: dGVzdHMtb25seS1zZWNyZXQtMDEyMzQ1Njc4OS1hYmNkZWZnaGlqa2xtbm9w
  issuer: alumni-uasz-user
user-service:
  # Client de user-service (ALUM-168) : jamais appelé par les tests d'intégration, l'URL doit seulement exister
  base-url: http://localhost:9
notification:
  # Client de notification-messaging-service (ALUM-119) : jamais appelé par les tests d'intégration
  base-url: http://localhost:9
notification-messaging-service:
  # Client de la messagerie (ALUM-246) : jamais appelé par les tests d'intégration, l'URL doit seulement exister
  base-url: http://localhost:9
