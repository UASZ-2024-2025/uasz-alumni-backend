apiVersion: v1
kind: ConfigMap
metadata:
  name: alumni-student-company-service-config
data:
  SERVER_PORT: "8082"
  SPRING_DATASOURCE_URL: jdbc:postgresql://alumni-student-company-service-postgres:5432/alumni_student_company_db
  FORWARD_HEADERS_STRATEGY: native
  # URL de production des contrats : https://api.alumni-uasz.sn/alumni-student-company-service/v1
  API_PREFIX: /alumni-student-company-service/v1
  JWT_ISSUER: alumni-uasz-user
  # Rattachement du compte ENTREPRISE à sa fiche (ALUM-168) : Service K8s sur le port 80
  USER_SERVICE_URL: http://user-service/user-service/v1
  # Synthèse d'accueil Alumni (ALUM-246) : non-lus de la messagerie, Service K8s sur le port 80
  NOTIFICATION_SERVICE_URL: http://notification-messaging-service/notification-messaging-service/v1
