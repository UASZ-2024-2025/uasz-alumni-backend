# Plateforme complète en local : 5 microservices + 1 base par service + SMTP + frontend.
#   ./setup.sh            (1re fois : génère .env avec mots de passe et secret JWT)
#   docker compose up -d --build
# Aucun secret ici : tout vient de .env (voir .env.example).
name: alumni-uasz

x-postgres: &postgres
  image: postgres:16-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 10

# Variables communes à tous les microservices
x-service-env: &service-env
  FORWARD_HEADERS_STRATEGY: none
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant, lancez ./setup.sh}
  JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER manquant}
  API_PREFIX: /v1
  CORS_ALLOWED_ORIGINS: ${FRONTEND_URL:?FRONTEND_URL manquant}
  # Inutilisée par les services qui n'appellent pas les notifications
  NOTIFICATION_SERVICE_URL: http://notification-messaging-service:8085/v1

x-service: &service
  restart: unless-stopped
  build: &service-build
    context: ..
    dockerfile: docker/service.Dockerfile

services:
  # ---------- Bases de données (une par service, non exposées sur l'hôte) ----------
  user-db:
    <<: *postgres
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: alumni_user
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD manquant, lancez ./setup.sh}
    volumes: [user-db:/var/lib/postgresql/data]

  alumni-student-company-db:
    <<: *postgres
    environment:
      POSTGRES_DB: alumni_student_company_db
      POSTGRES_USER: alumni_alumni_student_company
      POSTGRES_PASSWORD: ${ALUMNI_STUDENT_COMPANY_DB_PASSWORD:?ALUMNI_STUDENT_COMPANY_DB_PASSWORD manquant, lancez ./setup.sh}
    volumes: [alumni-student-company-db:/var/lib/postgresql/data]

  job-offer-db:
    <<: *postgres
    environment:
      POSTGRES_DB: job_offer_db
      POSTGRES_USER: alumni_job_offer
      POSTGRES_PASSWORD: ${JOB_OFFER_DB_PASSWORD:?JOB_OFFER_DB_PASSWORD manquant, lancez ./setup.sh}
    volumes: [job-offer-db:/var/lib/postgresql/data]

  analytics-matching-db:
    <<: *postgres
    environment:
      POSTGRES_DB: analytics_matching_db
      POSTGRES_USER: alumni_analytics_matching
      POSTGRES_PASSWORD: ${ANALYTICS_MATCHING_DB_PASSWORD:?ANALYTICS_MATCHING_DB_PASSWORD manquant, lancez ./setup.sh}
    volumes: [analytics-matching-db:/var/lib/postgresql/data]

  notification-messaging-db:
    <<: *postgres
    environment:
      POSTGRES_DB: notification_messaging_db
      POSTGRES_USER: alumni_notification_messaging
      POSTGRES_PASSWORD: ${NOTIFICATION_MESSAGING_DB_PASSWORD:?NOTIFICATION_MESSAGING_DB_PASSWORD manquant, lancez ./setup.sh}
    volumes: [notification-messaging-db:/var/lib/postgresql/data]

  # ---------- SMTP de test : emails lisibles sur http://localhost:8025 ----------
  # Utilisé tant que MAIL_HOST=mailpit ; avec Brevo (MAIL_HOST=smtp-relay.brevo.com) il reste inactif.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  # ---------- Microservices (ports 8081 à 8085) ----------
  user-service:
    <<: *service
    build:
      <<: *service-build
      args: {SERVICE: user-service}
    depends_on:
      user-db: {condition: service_healthy}
      mailpit: {condition: service_started}
    environment:
      <<: *service-env
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/user_db
      SPRING_DATASOURCE_USERNAME: alumni_user
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD}
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST manquant}
      MAIL_PORT: ${MAIL_PORT:?MAIL_PORT manquant}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # STARTTLS utilisé si le serveur le propose (Brevo), ignoré par Mailpit
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM manquant}
      FRONTEND_URL: ${FRONTEND_URL}
      EMAIL_CONFIRMATION_TTL: ${EMAIL_CONFIRMATION_TTL:?EMAIL_CONFIRMATION_TTL manquant}
    ports: ["127.0.0.1:8081:8081"]
    healthcheck: &service-health
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${SERVER_PORT}/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

  alumni-student-company-service:
    <<: *service
    build:
      <<: *service-build
      args: {SERVICE: alumni-student-company-service}
    depends_on:
      alumni-student-company-db: {condition: service_healthy}
    environment:
      <<: *service-env
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: jdbc:postgresql://alumni-student-company-db:5432/alumni_student_company_db
      SPRING_DATASOURCE_USERNAME: alumni_alumni_student_company
      SPRING_DATASOURCE_PASSWORD: ${ALUMNI_STUDENT_COMPANY_DB_PASSWORD}
    ports: ["127.0.0.1:8082:8082"]
    healthcheck: *service-health

  job-offer-service:
    <<: *service
    build:
      <<: *service-build
      args: {SERVICE: job-offer-service}
    depends_on:
      job-offer-db: {condition: service_healthy}
    environment:
      <<: *service-env
      SERVER_PORT: "8083"
      SPRING_DATASOURCE_URL: jdbc:postgresql://job-offer-db:5432/job_offer_db
      SPRING_DATASOURCE_USERNAME: alumni_job_offer
      SPRING_DATASOURCE_PASSWORD: ${JOB_OFFER_DB_PASSWORD}
    ports: ["127.0.0.1:8083:8083"]
    healthcheck: *service-health

  analytics-matching-service:
    <<: *service
    build:
      <<: *service-build
      args: {SERVICE: analytics-matching-service}
    depends_on:
      analytics-matching-db: {condition: service_healthy}
    environment:
      <<: *service-env
      SERVER_PORT: "8084"
      SPRING_DATASOURCE_URL: jdbc:postgresql://analytics-matching-db:5432/analytics_matching_db
      SPRING_DATASOURCE_USERNAME: alumni_analytics_matching
      SPRING_DATASOURCE_PASSWORD: ${ANALYTICS_MATCHING_DB_PASSWORD}
    ports: ["127.0.0.1:8084:8084"]
    healthcheck: *service-health

  notification-messaging-service:
    <<: *service
    build:
      <<: *service-build
      args: {SERVICE: notification-messaging-service}
    depends_on:
      notification-messaging-db: {condition: service_healthy}
    environment:
      <<: *service-env
      SERVER_PORT: "8085"
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-messaging-db:5432/notification_messaging_db
      SPRING_DATASOURCE_USERNAME: alumni_notification_messaging
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_MESSAGING_DB_PASSWORD}
    ports: ["127.0.0.1:8085:8085"]
    healthcheck: *service-health

  # ---------- Frontend Angular (http://localhost:4200) ----------
  # Construit depuis le dépôt Git du frontend (aucun fichier Docker requis dans ce dépôt).
  # Le navigateur appelle les API sur localhost:8081..8085 (environment.development.ts).
  frontend:
    restart: unless-stopped
    build:
      context: ${FRONTEND_CONTEXT:?FRONTEND_CONTEXT manquant}
      dockerfile_inline: |
        # syntax=docker/dockerfile:1
        FROM node:22-alpine AS build
        ENV NG_CLI_ANALYTICS=false
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci --no-audit --no-fund
        COPY angular.json tsconfig*.json ./
        COPY public/ public/
        COPY src/ src/
        RUN npx ng build --configuration development

        FROM nginx:1.27-alpine
        COPY <<'EOF' /etc/nginx/conf.d/default.conf
        server {
          listen 80;
          root /usr/share/nginx/html;
          location / { try_files $$uri $$uri/ /index.html; }
        }
        EOF
        COPY --from=build /app/dist/alumni-frontend/browser/ /usr/share/nginx/html/
    depends_on:
      - user-service
    ports: ["127.0.0.1:4200:80"]

volumes:
  user-db:
  alumni-student-company-db:
  job-offer-db:
  analytics-matching-db:
  notification-messaging-db:
