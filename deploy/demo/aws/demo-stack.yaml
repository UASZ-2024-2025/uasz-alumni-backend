AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Alumni UASZ - environnement de demo (ALUM-215) : 2 x t4g.small Ubuntu 24.04 + Docker Compose,
  HTTPS via Caddy/sslip.io, deploiement depuis GitHub Actions par OIDC + SSM (aucune cle,
  aucun port d'administration ouvert), sauvegardes S3, alertes de budget.
  Tout est supprimable en supprimant la pile (sauf le bucket de sauvegardes, conserve).

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC (le VPC par defaut convient)
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Sous-reseau PUBLIC du VPC (les deux machines y sont placees)
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.small, t4g.medium]
    Description: ARM (Graviton). t4g.small est eligible au Free plan.
  AmiId:
    Type: AWS::EC2::Image::Id
    Default: ami-02efb277a7839e588
    Description: >-
      Image FIXE (Ubuntu 24.04 arm64, eu-west-3), celle des machines en service. Changer d'image REMPLACE
      vm-a et vm-b et efface la base (disque de vm-a) : sauvegarder puis restaurer (voir README).
      Derniere image : aws ssm get-parameter --name
      /aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id
  RepoUrl:
    Type: String
    Default: https://github.com/UASZ-2024-2025/uasz-alumni-backend.git
  RepoRef:
    Type: String
    Default: develop
    Description: Branche clonee au premier demarrage (ensuite, chaque deploiement fixe le commit)
  GitHubOrg:
    Type: String
    Default: UASZ-2024-2025
  BackendRepo:
    Type: String
    Default: uasz-alumni-backend
  FrontendRepo:
    Type: String
    Default: Alumni-UASZ-frontend
  # Le dépôt GitHub utilise des sujets OIDC « immuables » (org@id/repo@id) :
  # gh api repos/<org>/<repo>/actions/oidc/customization/sub -> sub_claim_prefix
  GitHubOrgId:
    Type: String
    Default: "310733437"
  BackendRepoId:
    Type: String
    Default: "1441770878"
  FrontendRepoId:
    Type: String
    Default: "1441953671"
  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "false si le fournisseur OIDC token.actions.githubusercontent.com existe deja dans le compte"
  BudgetEmail:
    Type: String
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    Description: Adresse qui recoit les alertes de budget
  MonthlyBudgetUsd:
    Type: Number
    Default: 35

Conditions:
  CreateOidc: !Equals [!Ref CreateGitHubOidcProvider, "true"]

Resources:
  # ------------------------------------------------------------------ reseau
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: alumni-demo - HTTP/HTTPS public, trafic libre entre les 2 machines
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: udp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
      Tags: [{Key: Name, Value: alumni-demo}]

  SecurityGroupInternal:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: tcp
      FromPort: 0
      ToPort: 65535
      SourceSecurityGroupId: !Ref SecurityGroup
      Description: PostgreSQL (vm-a) et services (vm-b) entre les deux machines

  DemoEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags: [{Key: Name, Value: alumni-demo}]

  DemoEipAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt DemoEip.AllocationId
      InstanceId: !Ref VmA

  # ------------------------------------------------------------------ sauvegardes
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      LifecycleConfiguration:
        Rules:
          - {Id: expiration-30-jours, Status: Enabled, ExpirationInDays: 30}
      Tags: [{Key: Project, Value: alumni-demo}]

  # ------------------------------------------------------------------ machines
  # Un role par machine (moindre privilege). Agent SSM sur les deux : Run Command
  # (deploiements) et Session Manager (console sans SSH).
  # vm-a : cree les secrets, lit l'IP de vm-b et la config SMTP, ecrit les sauvegardes dans S3.
  InstanceRoleA:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: alumni-demo-vm-a
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:PutParameter]
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/alumni-demo/secrets
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/alumni-demo/vm-b-private-ip
                  # SMTP réel (Brevo) : paramètre facultatif créé à la main, lu à chaque déploiement
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/alumni-demo/mail
              - Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey]
                Resource: "*"
                Condition:
                  StringEquals: {kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"}
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub ${BackupBucket.Arn}/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt BackupBucket.Arn

  # vm-b : lecture seule des secrets, et du SMTP réel (e-mails de notification, ALUM-135)
  InstanceRoleB:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: alumni-demo-vm-b
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/alumni-demo/secrets
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/alumni-demo/mail
                  # Pièces jointes de la messagerie (Cloudinary, ALUM-261) : paramètre facultatif créé à la main
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/alumni-demo/cloudinary
              - Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals: {kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"}

  InstanceProfileA:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRoleA]

  InstanceProfileB:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRoleB]

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        # IMDSv2 obligatoire, limite de 1 saut : seuls les processus de l'hote (bootstrap,
        # sauvegarde, agent SSM) joignent l'IMDS. Les conteneurs (un saut de plus via le pont
        # Docker) n'y ont pas acces : une SSRF dans un service ne livre pas le role de la machine.
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs: {VolumeSize: 20, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
        TagSpecifications:
          - ResourceType: volume
            Tags: [{Key: Project, Value: alumni-demo}]

  # vm-a : Caddy, frontend, PostgreSQL, Mailpit, user-service, alumni-student-company-service
  VmA:
    Type: AWS::EC2::Instance
    Properties:
      IamInstanceProfile: !Ref InstanceProfileA
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref SecurityGroup]
          AssociatePublicIpAddress: true
      Tags:
        - {Key: Name, Value: alumni-demo-a}
        - {Key: alumni-demo, Value: vm-a}
        - {Key: Project, Value: alumni-demo}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee -a /var/log/alumni-bootstrap.log) 2>&1
          apt-get update -q && apt-get install -yq git
          mkdir -p /opt/alumni
          [ -d /opt/alumni/app/.git ] || git clone -q --branch ${RepoRef} ${RepoUrl} /opt/alumni/app
          /opt/alumni/app/deploy/demo/scripts/bootstrap.sh --role vm-a \
            --domain alumni-demo.${DemoEip.PublicIp}.sslip.io \
            --ssm-prefix /alumni-demo --backup-bucket ${BackupBucket} \
            --vm-b-host-param /alumni-demo/vm-b-private-ip \
            --repo ${RepoUrl} --ref ${RepoRef}

  # vm-b : job-offer-service, analytics-matching-service, notification-messaging-service
  VmB:
    Type: AWS::EC2::Instance
    Properties:
      IamInstanceProfile: !Ref InstanceProfileB
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref SecurityGroup]
          # IP publique : nécessaire pour télécharger les images (pas de NAT, trop cher)
          AssociatePublicIpAddress: true
      Tags:
        - {Key: Name, Value: alumni-demo-b}
        - {Key: alumni-demo, Value: vm-b}
        - {Key: Project, Value: alumni-demo}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee -a /var/log/alumni-bootstrap.log) 2>&1
          apt-get update -q && apt-get install -yq git
          mkdir -p /opt/alumni
          [ -d /opt/alumni/app/.git ] || git clone -q --branch ${RepoRef} ${RepoUrl} /opt/alumni/app
          /opt/alumni/app/deploy/demo/scripts/bootstrap.sh --role vm-b \
            --db-host ${VmA.PrivateIp} --ssm-prefix /alumni-demo \
            --repo ${RepoUrl} --ref ${RepoRef}

  # vm-a lit l'IP privee de vm-b ici (evite une dependance circulaire entre les deux machines)
  VmBPrivateIpParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /alumni-demo/vm-b-private-ip
      Type: String
      Value: !GetAtt VmB.PrivateIp

  # ------------------------------------------------------------------ GitHub Actions (OIDC)
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # Seule commande que GitHub peut lancer sur les machines : deploy.sh, avec des parametres
  # filtres (hexadecimal, noms de composants) - aucune commande shell libre.
  # deploy.sh refuse en plus tout commit qui n'est pas dans develop.
  DeployDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: alumni-demo-deploy
      DocumentType: Command
      UpdateMethod: NewVersion
      Content:
        schemaVersion: "2.2"
        description: Deploiement de la demo Alumni UASZ (deploy/demo/scripts/deploy.sh)
        parameters:
          ref:
            type: String
            description: Commit du depot backend (40 caracteres hexadecimaux) ou vide
            default: ""
            allowedPattern: "^[0-9a-f]{0,40}$"
          components:
            type: String
            description: "composant=commit separes par des espaces (ex. frontend=<sha>)"
            default: ""
            allowedPattern: "^[a-z0-9= -]{0,700}$"
        mainSteps:
          - action: aws:runShellScript
            name: deploy
            inputs:
              timeoutSeconds: "900"
              runCommand:
                - set -eu
                - REF="{{ ref }}"
                - exec /opt/alumni/app/deploy/demo/scripts/deploy.sh ${REF:+--ref $REF} {{ components }}

  # Un role par depot. Le sujet OIDC « environment:demo » n'est emis que pour les jobs de
  # l'environnement GitHub « demo », lui-meme limite a la branche develop (voir README).
  BackendDeployRole:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidc
                - !GetAtt GitHubOidcProvider.Arn
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}@${GitHubOrgId}/${BackendRepo}@${BackendRepoId}:environment:demo
                  - !Sub repo:${GitHubOrg}/${BackendRepo}:environment:demo
      Policies:
        - PolicyName: deploy-demo-backend
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${DeployDocument}
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${VmA}
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${VmB}
              - Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations, ec2:DescribeInstances]
                Resource: "*"

  # Le frontend ne tourne que sur vm-a : son role ne peut viser que cette machine.
  FrontendDeployRole:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidc
                - !GetAtt GitHubOidcProvider.Arn
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}@${GitHubOrgId}/${FrontendRepo}@${FrontendRepoId}:environment:demo
                  - !Sub repo:${GitHubOrg}/${FrontendRepo}:environment:demo
      Policies:
        - PolicyName: deploy-demo-frontend
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${DeployDocument}
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${VmA}
              - Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations, ec2:DescribeInstances]
                Resource: "*"

  # ------------------------------------------------------------------ budget
  # IncludeCredit: false -> les alertes portent sur la consommation REELLE, avant deduction
  # des credits (sinon le cout affiche reste a 0 $ et aucune alerte ne part).
  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: alumni-demo-mensuel
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref MonthlyBudgetUsd, Unit: USD}
        CostTypes: {IncludeCredit: false, IncludeRefund: false}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]

Outputs:
  DemoUrl:
    Value: !Sub https://alumni-demo.${DemoEip.PublicIp}.sslip.io
  MailpitUrl:
    Value: !Sub https://alumni-demo.${DemoEip.PublicIp}.sslip.io/mailpit/
  BackendDeployRoleArn:
    Description: Variable GitHub AWS_DEPLOY_ROLE_ARN du depot backend
    Value: !GetAtt BackendDeployRole.Arn
  FrontendDeployRoleArn:
    Description: Variable GitHub AWS_DEPLOY_ROLE_ARN du depot frontend
    Value: !GetAtt FrontendDeployRole.Arn
  BackupBucketName:
    Value: !Ref BackupBucket
  VmAInstanceId:
    Value: !Ref VmA
  VmBInstanceId:
    Value: !Ref VmB
  SecretsParameter:
    Description: Secrets de la demo (dont BOOTSTRAP_ADMIN_PASSWORD et MAILPIT_UI_AUTH)
    Value: /alumni-demo/secrets
