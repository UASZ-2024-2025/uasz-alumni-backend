name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Les contrats produisent-ils des SPIs valides ? (verify : aucune publication)
  spis-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: spis
        with:
          filters: |
            changed:
              - 'contracts/**'
              - 'spis/pom.xml'
              - 'spis/*-spi/pom.xml'
      - uses: actions/setup-java@v4
        if: steps.spis.outputs.changed == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: spis/pom.xml
      - name: Generer les SPIs (verification)
        if: steps.spis.outputs.changed == 'true'
        working-directory: spis
        run: ./mvnw -B -ntp clean verify -DskipTests

  # Detecte les microservices modifies : seuls ceux-la sont construits.
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            user-service:
              - 'user-service/**'
              - 'spis/repo/com/uasz/alumni/user-service-spi/**'
              - 'spis/repo/com/uasz/alumni/alumni-spis/**'
              - 'docker/**'
            alumni-student-company-service:
              - 'alumni-student-company-service/**'
              - 'spis/repo/com/uasz/alumni/alumni-student-company-service-spi/**'
              - 'spis/repo/com/uasz/alumni/alumni-spis/**'
              - 'docker/**'
            job-offer-service:
              - 'job-offer-service/**'
              - 'spis/repo/com/uasz/alumni/job-offer-service-spi/**'
              # client de notification-messaging-service (contrat consommé)
              - 'spis/repo/com/uasz/alumni/notification-messaging-service-spi/**'
              - 'spis/repo/com/uasz/alumni/alumni-spis/**'
              - 'docker/**'
            analytics-matching-service:
              - 'analytics-matching-service/**'
              - 'spis/repo/com/uasz/alumni/analytics-matching-service-spi/**'
              - 'spis/repo/com/uasz/alumni/alumni-spis/**'
              - 'docker/**'
            notification-messaging-service:
              - 'notification-messaging-service/**'
              - 'spis/repo/com/uasz/alumni/notification-messaging-service-spi/**'
              - 'spis/repo/com/uasz/alumni/alumni-spis/**'
              - 'docker/**'

  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build Maven
        working-directory: ${{ matrix.service }}
        run: ./mvnw -B -DskipTests package

      - name: Nom d'image (minuscules)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          file: docker/service.Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
