name: Sonar

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    # Actif seulement si un serveur SonarQube accessible depuis GitHub est configuré
    # (variable de dépôt SONAR_HOST_URL + secret SONAR_TOKEN).
    if: ${{ vars.SONAR_HOST_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "*/pom.xml"
      - name: Analyse SonarQube (5 services)
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./sonar/sonar.sh scan all
