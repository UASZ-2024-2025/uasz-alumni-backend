server:
  port: ${SERVER_PORT}
  shutdown: graceful
  # "native" derrière un ingress de confiance pour obtenir la vraie IP cliente
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY}

spring:
  application:
    name: analytics-matching-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD viennent de l'environnement
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

security:
  api:
    prefix: ${API_PREFIX}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Secret et émetteur identiques dans TOUS les services.
# user-service génère le secret ; les autres le copient (make setup / make jwt-sync).
jwt:
  # Base64, 32 octets minimum
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER}

# Jetons de service (ADR-0010) : GET /internal/stats d'alumni-student-company-service (ALUM-182)
service-token:
  issuer: alumni-uasz-internal
  ttl: 5m

# Services sources du tableau de bord administrateur (ALUM-182), lus en REST (ADR-0006)
clients:
  student-company:
    base-url: ${STUDENT_COMPANY_SERVICE_URL}
  job-offer:
    base-url: ${JOB_OFFER_SERVICE_URL}
  connect-timeout: 2s
  read-timeout: 3s

analytics:
  dashboard:
    cache-ttl: PT5M
