server:
  port: ${SERVER_PORT}
  shutdown: graceful
  # "native" derrière un ingress de confiance pour obtenir la vraie IP cliente
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY}

spring:
  application:
    name: analytics-matching-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD viennent de l'environnement
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

security:
  api:
    prefix: ${API_PREFIX}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Secret et émetteur identiques dans TOUS les services.
# user-service génère le secret ; les autres le copient (make setup / make jwt-sync).
jwt:
  # Base64, 32 octets minimum
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER}

# Jetons de service pour les appels inter-services (ADR-0010) : émetteur interne, distinct de jwt.issuer
service-token:
  issuer: alumni-uasz-internal
  ttl: 5m

# Client d'alumni-student-company-service : situation d'emploi des diplômés pour le rapport d'insertion (ALUM-183).
# ADR-0006 : lecture synchrone, timeouts courts, un seul retry (la requête de l'administrateur attend la réponse).
student-company:
  base-url: ${STUDENT_COMPANY_SERVICE_URL}
  connect-timeout: 2s
  read-timeout: 5s
  retry:
    max-retries: 1
    delay-ms: 200
    multiplier: 2
    max-delay-ms: 1000
